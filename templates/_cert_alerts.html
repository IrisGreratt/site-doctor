{# 证书到期提醒：被多个页面共用，单独抽成片段避免重复写 #}
{% if cert_alerts %}
<div class="alert alert-warn">
  <strong>🔔 证书到期提醒</strong>
  <ul class="alert-list">
    {% for alert in cert_alerts %}
    <li>
      <a href="/?url={{ alert.url | urlencode }}">{{ alert.url }}</a>
      —— 证书剩余 <b>{{ alert.days }}</b> 天
    </li>
    {% endfor %}
  </ul>
</div>
{% endif %}
